; Прошивка clap-light на ESP-IDF. Плата: ESP32-S3-WROOM-1 N16R8.
; Флеш і PSRAM задано в sdkconfig.defaults.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
; RTS/DTR керують EN та IO0 на COM-порту. Без цього монітор тримає плату в reset.
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; Прошивка для збору датасету: світло не перемикає, кліпи довші (0,5 с до удару й 1,5 с після), шле частіше.
;   pio run -e dataset -t upload      назад на звичайну: pio run -e esp32s3 -t upload
[env:dataset]
extends = env:esp32s3
build_flags = -DDATASET=1
